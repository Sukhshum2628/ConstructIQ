org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation stores relative paths between the build dir
# and plugin sources. With the project on D:\ and the pub cache on C:\ it cannot
# relativize across drive roots and crashes ("different roots"). Disabling the
# incremental cache avoids that — it only affects rebuild speed, not output.
kotlin.incremental=false
